body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 85% -10%,rgba(110,52,130,.35),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(73,34,91,.45),transparent 60%)}
html[data-theme="light"] body::before{background:radial-gradient(900px 600px at 85% -10%,rgba(165,106,189,.22),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(231,219,239,.9),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent2)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;font-optical-sizing:auto}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
::selection{background:rgba(165,106,189,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--card3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;border-bottom:1px solid var(--line2)}
.brand .mk{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:radial-gradient(circle at 32% 28%,#C69BDA,#6E3482 55%,#49225B);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(73,34,91,.45);display:grid;place-items:center;color:#fff}
.brand .mk img{width:30px;height:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.brand b{display:block;font-family:var(--serif);font-size:18px;line-height:1.05;font-weight:600}
.brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 12px;margin-bottom:2px;border-radius:12px;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s;position:relative}
.nav button .ic{color:var(--muted)}
.nav button:hover{background:var(--card2)}
.nav button.on{background:linear-gradient(135deg,var(--violet),var(--royal));color:#fff;box-shadow:var(--glow)}
.nav button.on .ic{color:#F5EBFA}
.nav .bd{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--card3);color:var(--ink2);font-size:11px;font-weight:700;text-align:center}
.nav button.on .bd{background:rgba(255,255,255,.2);color:#fff}
.nav .sep{height:1px;background:var(--line2);margin:8px 6px}
.lvl{margin:10px 12px 14px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lvl .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lvl .t b{color:var(--ink);font-size:13px}
.bar{height:7px;border-radius:7px;background:var(--card3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--violet),var(--lav));transition:width .6s}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .burger{display:none}
.top h1{font-size:23px;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.srch{position:relative;width:240px}
.srch input,.srch input[type=search]{width:100%;padding:9px 12px 9px 36px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0}
.srch input:focus{border-color:var(--accent)}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch .res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:360px;overflow:auto;display:none;z-index:60;padding:6px}
.srch .res.open{display:block}
.srch .res button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px}
.srch .res button:hover,.srch .res button.hl{background:var(--card2)}
.icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:0 0 38px;transition:background .15s,transform .1s}
.icb:hover{background:var(--card2)}
.icb:active{transform:scale(.95)}
.view{padding:24px 28px 90px;max-width:1240px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%}
.subs button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.subs button:hover{color:var(--ink);background:var(--card2)}
.subs button.on{background:var(--btn);color:#fff;box-shadow:0 4px 12px rgba(110,52,130,.35)}
.subs .bd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.18)}
.subs button:not(.on) .bd{background:var(--card3);color:var(--ink2)}
.fab{position:fixed;right:24px;bottom:24px;z-index:45;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#C69BDA,#6E3482 60%,#49225B);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(73,34,91,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
.fab:hover{transform:scale(1.06) rotate(90deg)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.bnav{display:none}
.scrim{display:none}

/* ---------- generic ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2);min-width:0;position:relative}
.card.glass{background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 90%,transparent),var(--card))}
.card h3,.ch h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{color:var(--accent)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(110,52,130,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card2);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.soft:hover{background:var(--card3);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:16px;height:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(165,106,189,.18)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:13px}
input[type=range]{width:100%;accent-color:var(--lav)}
input[type=checkbox]{accent-color:var(--lav);width:17px;height:17px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .orb{width:74px;height:74px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.tip{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.tip .ic{color:var(--accent);margin-top:1px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}

/* ---------- stats ---------- */
.stat{display:flex;gap:13px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card3);color:var(--accent2);flex:0 0 44px}
.stat .si .ic{width:21px;height:21px}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
button.card{text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
button.card:hover{transform:translateY(-2px);border-color:var(--accent)}

/* ---------- thought rows ---------- */
.list{display:flex;flex-direction:column;gap:7px}
.th{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);transition:border-color .15s,background .15s;min-width:0}
.th:hover{border-color:var(--line)}
.th .tb{flex:1;min-width:0}
.th .tt{font-size:14px;overflow-wrap:anywhere}
.th .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.th .acts{display:flex;gap:4px;flex:0 0 auto}
.th .acts button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.th .acts button:hover{background:var(--card3);color:var(--ink)}
.th .acts .ic{width:16px;height:16px}
.th.done .tt{text-decoration:line-through;color:var(--muted)}
.tdot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center;flex:0 0 24px;transition:background .15s;color:transparent}
.ck:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ck.on{background:var(--good);border-color:var(--good);color:#fff}
.ck .ic{width:14px;height:14px;stroke-width:3}

/* ---------- 3D orbs (CSS spheres) ---------- */
.orb{border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),color-mix(in srgb,var(--c,#A56ABD) 70%,#fff) 12%,var(--c,#A56ABD) 42%,color-mix(in srgb,var(--c,#A56ABD) 45%,#000) 100%);box-shadow:inset -8px -10px 22px rgba(0,0,0,.35),0 14px 26px color-mix(in srgb,var(--c,#A56ABD) 35%,transparent)}
.orb::after{content:"";position:absolute;left:12%;right:12%;bottom:-16%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);filter:blur(2px)}
.orbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.orbs button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:14px;transition:background .15s}
.orbs button:hover{background:var(--card2)}
.orbs button:hover .orb{transform:translateY(-4px) scale(1.04)}
.orbs .orb{transition:transform .25s;animation:bob 4s ease-in-out infinite}
.orbs button:nth-child(2) .orb{animation-delay:-.7s}.orbs button:nth-child(3) .orb{animation-delay:-1.4s}.orbs button:nth-child(4) .orb{animation-delay:-2.1s}.orbs button:nth-child(5) .orb{animation-delay:-2.8s}.orbs button:nth-child(6) .orb{animation-delay:-3.5s}
.orbs .orb b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.orbs small{font-size:12px;color:var(--muted);font-weight:500}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- mind sphere ---------- */
.sphere{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(110,52,130,.38),transparent 62%),linear-gradient(160deg,#241030,#12071A);border:1px solid var(--line);box-shadow:var(--shadow);min-height:360px}
html[data-theme="light"] .sphere{background:radial-gradient(circle at 50% 45%,rgba(165,106,189,.30),transparent 62%),linear-gradient(160deg,#FFFFFF,#EFE3F6)}
.sphere canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.sphere canvas:active{cursor:grabbing}
.sphere .ov{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.sphere .ov h3{font-size:19px;color:var(--ink)}
.sphere .ov .sub{max-width:280px}
.sphere .lg{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);pointer-events:none}
.sphere .lg span{display:flex;align-items:center;gap:5px}
.sphere .hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--faint);pointer-events:none}
.sphere .tipbox{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:11px;font-size:12.5px;max-width:240px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:3}
.sphere .tipbox.on{opacity:1;transform:none}
.sphere .tipbox small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.sphere .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.sphere .ctr b{display:block;font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);text-shadow:0 2px 18px rgba(110,52,130,.6)}
.sphere .ctr small{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- rings & gauges ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;text-align:center;line-height:1.1}
.ring .rc b{display:block;font-family:var(--serif);font-size:30px}
.ring .rc small{font-size:11.5px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.gauge{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--card3);border:3px solid var(--line);box-shadow:inset 0 -10px 30px rgba(0,0,0,.25);margin:0 auto}
.gauge .lq{position:absolute;left:-50%;right:-50%;bottom:0;background:linear-gradient(180deg,#A56ABD,#6E3482 60%,#49225B);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.gauge .lq::before{content:"";position:absolute;left:50%;bottom:calc(100% - 7px);width:70%;aspect-ratio:1;transform:translateX(-50%) rotate(0);border-radius:42%;background:var(--card3);animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(-50%) rotate(360deg)}}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);line-height:1}
.gauge .gv b{font-family:var(--serif);font-size:38px}
.gauge .gv small{display:block;font-size:11px;margin-top:4px;letter-spacing:.08em}
html[data-theme="light"] .gauge .gv{color:var(--ink)}
html[data-theme="light"] .gauge .gv b,html[data-theme="light"] .gauge .gv small{text-shadow:0 0 8px #fff,0 0 3px #fff}

/* ---------- timer ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px}
.timer .ring .rc b{font-size:40px;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ---------- capture ---------- */
.cap{display:flex;gap:8px}
.cap input{font-size:15.5px;padding:13px 15px;border-radius:14px}
.cap .btn{padding:0 18px;border-radius:14px}
.prompt{padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,var(--royal),var(--violet));color:#fff;position:relative;overflow:hidden;min-height:94px}
.prompt::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.prompt small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.prompt p{font-family:var(--serif);font-size:19px;line-height:1.3;margin-top:5px;position:relative;z-index:1}
.prompt .row{margin-top:10px;position:relative;z-index:1}
.prompt .btn{background:rgba(255,255,255,.16);color:#fff}
.prompt .btn:hover{background:rgba(255,255,255,.26)}
.fly{position:fixed;z-index:90;pointer-events:none;width:14px;height:14px;border-radius:50%;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .7s}

/* ---------- sorting deck (3D) ---------- */
.deckwrap{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px 0}
.deck{position:relative;width:min(560px,100%);aspect-ratio:1/1;max-height:560px}
.deck .stage{position:absolute;left:50%;top:50%;width:52%;height:40%;transform:translate(-50%,-50%);perspective:1200px;z-index:2}
.dcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .35s}
.dcard.flip{transform:rotateY(180deg)}
.dcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--card3),var(--card));border:1px solid var(--line);box-shadow:0 26px 50px rgba(5,0,10,.45),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
html[data-theme="light"] .dcard .face{background:linear-gradient(155deg,#fff,#F3E8F8);box-shadow:0 22px 44px rgba(73,34,91,.18)}
.dcard .back{transform:rotateY(180deg)}
.dcard .face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.dcard .tt{font-family:var(--serif);font-size:20px;line-height:1.3;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;overflow:auto}
.dcard .back .fld{margin-bottom:8px}
.dcard .back input,.dcard .back select{padding:7px 10px;font-size:13px}
.ghost1,.ghost2{position:absolute;inset:0;border-radius:20px;background:var(--card2);border:1px solid var(--line2);transform:translateY(10px) scale(.96);z-index:-1}

.rt:hover{transform:scale(1.08);border-color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--card))}

/* ---------- bubbles ---------- */
.bub{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size}

.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.steps{display:flex;flex-direction:column;gap:5px}

.course li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13.5px}

.breath .rg{position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(165,106,189,.55);transform-style:preserve-3d;animation:rg 9s linear infinite}
